version: 1.3.5
cache: true

# =============================================================================
# JARVIS LibreChat Configuration — CORRECTED 2026-05-31
# Multi-model access via OpenRouter + MCP integrations
# Transport: streamable-http (NOT SSE — see note below)
#
# CHANGES vs the deployed version:
#   1. google_workspace: removed `startup: false` so the Drive/Calendar MCP
#      connects at app startup instead of requiring a manual per-session
#      reconnect. This is the likely root cause of "Drive context not loading."
#      (Code ref: ConnectionsRepository.isAllowedToConnectToServer — a server
#       with startup:false is EXCLUDED from app-level connections.)
#      google_workspace has no oauth: block and no user vars, so its auth is
#      handled server-side on Railway → safe to auto-init at startup.
#   2. Fixed the stale "SSE-based" header comment — all active servers are
#      already streamable-http. No SSE migration is needed (that rec is moot).
#   3. supermemory: left startup:false (it uses per-user OAuth) but annotated.
#      It degrades silently per the skill's §10, so it is not critical-path.
#
# TEST AFTER DEPLOY: open a fresh session, run /jarvis, confirm the Context
# Receipt shows "Vault canon: loaded" WITHOUT a manual MCP reconnect.
# =============================================================================

mcpSettings:
  allowedDomains:
    - "mcp.notion.com"
    - "mcp.supermemory.ai"
    - "googleworkspacemcp-production-73bd.up.railway.app"
speech:
  stt:
    openai:
      url: "https://api.openai.com/v1/audio"
      apiKey: "${OPENAI_STT_KEY}"
      model: "whisper-1"
  tts:
    openai:
      url: "https://api.openai.com/v1/audio"
      apiKey: "${OPENAI_TTS_KEY}"
      model: "tts-1"
      voices:
        - "onyx"
        - "alloy"
        - "echo"
        - "fable"
        - "nova"
        - "shimmer"

interface:
  privacyPolicy:
    externalUrl: ""
  termsOfService:
    externalUrl: ""

registration:
  socialLogins: []
  allowedDomains:
    - "gmail.com"

# =============================================================================
# MODEL ACCESS — all models route through OpenRouter (single custom endpoint).
# FAILOVER NOTE: LibreChat has no native model-failover feature, but because
# every model already goes through OpenRouter, provider-level outages are
# absorbed by OpenRouter's own routing. To add explicit model-level fallback
# (e.g., Opus -> GPT-5.4 -> Gemini), configure it on the OpenRouter side
# (account routing preferences / request `models` array), NOT here. So the
# "OpenAI down = LibreChat dead" failure mode is already largely mitigated.
# =============================================================================
endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "anthropic/claude-opus-4.6"
          - "anthropic/claude-sonnet-4.6"
          - "anthropic/claude-haiku-4.5"
          - "openai/gpt-5.4"
          - "openai/gpt-5.4-nano"
          - "openai/gpt-5.3-codex"
          - "google/gemini-3.1-pro"
          - "google/gemini-3.1-flash-lite"
          - "google/gemini-3-flash-preview"
        fetch: true
      titleConvo: true
      titleModel: "google/gemini-3.1-flash-lite"
      summarize: false
      forcePrompt: false
      dropParams:
        - "stop"
        - "user"
      modelDisplayLabel: "OpenRouter"
      iconURL: "https://openrouter.ai/favicon.ico"

# =============================================================================
# MCP SERVERS — streamable-http for Railway cloud deployment
# =============================================================================

mcpServers:
  # =========================================================================
  # NOTION — Jarvis operational databases (Notion hosted MCP). OAuth on first use.
  # =========================================================================
  notion:
    type: streamable-http
    url: "https://mcp.notion.com/mcp"
    oauth:
      redirect_uri: "https://librechat-production-a9cd.up.railway.app/api/mcp/notion/oauth/callback"
    serverInstructions: >
      Zachary's Notion workspace containing 16 Jarvis operational databases:
      Active Priorities, Active Board (tasks + Direction obligation rows —
      People Tracker merged 2026-07-03; NEVER write to the archived People
      Tracker DB debd4672...), People Directory, Arcs, Decisions, Relationship
      Dynamics, Succession Pipeline, Deliverables, Mental Models, Capture Inbox,
      Quotes, Episodic Archive, Self-Leadership Learnings, Artifact Registry,
      Standing Cadences, and Vendor and Tool Stack. Obligation views on Active
      Board (b129fe54080b4217a5bdeb0b05ef3c5b): What I Owe
      v=392fca554f2b81f19d9e000cbf81c13a, What's Owed to Me
      v=392fca554f2b8192b7c2000ceefa1526, By Direction
      v=392fca554f2b81a4ab65000cbf3c6686. Use NOTION-OPS.md patterns for
      database IDs and queries.
    timeout: 30000
    initTimeout: 10000

  # =========================================================================
  # GOOGLE WORKSPACE — Drive (vault canon) + Calendar. CRITICAL PATH.
  # The thin-shim architecture pulls LIBRE-HOT.md + CONTEXT.md live from here,
  # so this server MUST be connected at startup. `startup: false` REMOVED.
  # Vault root: 1lkD-mp14cHp0-7IsGIu9b-Oth5GYKxV-
  # Jarvis/:    1rbtlW4_J7lJ_yoqx-ORKP8Iv9uKekVMO
  # Modes/:     1YLuyatpi5e4WfcEIr_vdY2NrzrjkOUcl
  # =========================================================================
  google_workspace:
    type: streamable-http
    url: "https://googleworkspacemcp-production-73bd.up.railway.app/mcp"
    timeout: 30000
    initTimeout: 15000
    serverInstructions: >
      Google Workspace tools for Drive and Calendar access.
      Drive contains Zachary's Obsidian vault with Jarvis system files.
      Always-on (app-level) so the Context Floor (skill §2a) can pull
      Jarvis/LIBRE-HOT.md (hot tier) and Jarvis/CONTEXT.md (depth) every session.
      Vault root: 1lkD-mp14cHp0-7IsGIu9b-Oth5GYKxV-
      Jarvis/: 1rbtlW4_J7lJ_yoqx-ORKP8Iv9uKekVMO
      Modes/: 1YLuyatpi5e4WfcEIr_vdY2NrzrjkOUcl

  # =========================================================================
  # SUPERMEMORY — Semantic recall. Per-user OAuth, so startup:false is kept.
  # Degrades silently (skill §10) — supplements, never critical-path.
  # =========================================================================
  supermemory:
    type: streamable-http
    url: "https://mcp.supermemory.ai/mcp"
    startup: false
    oauth:
      redirect_uri: "https://librechat-production-a9cd.up.railway.app/api/mcp/supermemory/oauth/callback"
    timeout: 15000
    serverInstructions: >
      Semantic memory layer for Jarvis. Container: sm_project_jarvis.
      Use recall with containerTag "sm_project_jarvis" to retrieve
      cross-session context. Supplements Notion databases with fuzzy
      similarity matching. Never replace canonical data — only supplement.
      If recalled memory contradicts flat file state, trust the flat file.
